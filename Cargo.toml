[package]
name = "pqsign"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Hybrid post-quantum file signing (Ed25519 + ML-DSA-65)"
license = "MIT"
repository = "https://github.com/pscheid92/pqsign"
readme = "README.md"
keywords = ["cryptography", "post-quantum", "signing", "ed25519", "ml-dsa"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["docs/", "benches/", ".github/", ".idea/", "release.key.pub"]

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
fips204 = "0.4"
blake2 = "0.11"
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
rand = "0.10"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
thiserror = "2"
# 1.9.1 stops wiping a Vec twice; 1.9.0 made every Argon2id key derivation about 100 ms slower.
zeroize = { version = "1.9.1", features = ["derive"] }
rpassword = "7"
clap_complete = "4.6.0"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2.2.0"
criterion = "0.8"
predicates = "3.1.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# panic stays "unwind": secret key material is wiped in Drop, which panic = "abort" would skip.

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "cli"
harness = false
